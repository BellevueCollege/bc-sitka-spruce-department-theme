# Variable group: sitka-e2e
# Create in Azure DevOps with LT_USERNAME, LT_ACCESS_KEY, GITHUB_PAT, ACF_DOWNLOAD_URL

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

jobs:
  - job: e2e
    timeoutInMinutes: 45
    variables:
      - group: sitka-e2e
    steps:
      - checkout: self

      - task: UseNode@1
        inputs:
          version: '22.x'

      - script: npm ci
        displayName: npm ci

      - script: npm run build
        displayName: npm run build

      - script: npx playwright install --with-deps chromium
        displayName: Install Playwright Chromium

      - script: npm run env:e2e:start
        displayName: Start wp-env e2e WordPress
        env:
          GITHUB_PAT: $(GITHUB_PAT)
          ACF_DOWNLOAD_URL: $(ACF_DOWNLOAD_URL)

      - script: npm run test:e2e:functional
        displayName: Functional e2e tests
        env:
          E2E_WPENV_EXTERNAL: '1'
          GITHUB_PAT: $(GITHUB_PAT)
          ACF_DOWNLOAD_URL: $(ACF_DOWNLOAD_URL)
          BUILD_ID: $(Build.BuildId)

      - script: node tests/e2e/scripts/lambdatest-tunnel.mjs start
        displayName: Start LambdaTest tunnel
        env:
          LT_USERNAME: $(LT_USERNAME)
          LT_ACCESS_KEY: $(LT_ACCESS_KEY)

      - script: npm run test:e2e:visual
        displayName: Visual e2e tests on LambdaTest
        env:
          E2E_WPENV_EXTERNAL: '1'
          LT_USERNAME: $(LT_USERNAME)
          LT_ACCESS_KEY: $(LT_ACCESS_KEY)
          GITHUB_PAT: $(GITHUB_PAT)
          ACF_DOWNLOAD_URL: $(ACF_DOWNLOAD_URL)
          BUILD_ID: $(Build.BuildId)
          E2E_LAMBDATEST_TUNNEL_AUTO: '0'

      - script: node tests/e2e/scripts/lambdatest-tunnel.mjs stop
        displayName: Stop LambdaTest tunnel
        condition: always()

      - script: npm run env:e2e:stop
        displayName: Stop wp-env e2e WordPress
        condition: always()

      - task: PublishTestResults@2
        displayName: Publish JUnit results
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: artifacts/test-results/*.xml
          mergeTestResults: true

      - task: PublishPipelineArtifact@1
        displayName: Publish failure artifacts
        condition: failed()
        inputs:
          targetPath: artifacts
          artifact: e2e-artifacts

# Playwright + wp-env + LambdaTest steps for theme-ci Test stage.
# Requires pipeline variables in ADO (LT_USERNAME, LT_ACCESS_KEY, GITHUB_PAT, ACF_DOWNLOAD_URL).

steps:
  - task: Cache@2
    displayName: Cache Playwright Chromium
    inputs:
      key: 'playwright | "$(Agent.OS)" | package.json'
      restoreKeys: |
        playwright | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.playwright-browsers

  - script: npx playwright install --with-deps chromium
    displayName: Install Playwright Chromium
    env:
      PLAYWRIGHT_BROWSERS_PATH: $(Pipeline.Workspace)/.playwright-browsers

  - script: npm run env:e2e:start
    displayName: Start wp-env e2e WordPress
    retryCountOnTaskFailure: 2
    env:
      CI: 'true'
      E2E_STRICT_PLUGINS: '1'
      GITHUB_PAT: $(GITHUB_PAT)
      ACF_DOWNLOAD_URL: $(ACF_DOWNLOAD_URL)

  - script: npm run tunnel:e2e:start:detached
    displayName: Start LambdaTest tunnel without waiting
    env:
      LT_USERNAME: $(LT_USERNAME)
      LT_ACCESS_KEY: $(LT_ACCESS_KEY)
      E2E_LAMBDATEST_TUNNEL_NAME: e2e-tunnel-ado-$(Build.BuildId)

  - script: npm run test:e2e:functional
    displayName: Functional e2e tests (includes 20 desktop @aria snapshots; excludes @visual)
    env:
      CI: 'true'
      E2E_STRICT_PLUGINS: '1'
      GITHUB_PAT: $(GITHUB_PAT)
      ACF_DOWNLOAD_URL: $(ACF_DOWNLOAD_URL)
      BUILD_ID: $(Build.BuildId)
      PLAYWRIGHT_BROWSERS_PATH: $(Pipeline.Workspace)/.playwright-browsers

  - script: npm run env:e2e:reseed
    displayName: Reseed wp-env before visual e2e
    retryCountOnTaskFailure: 2
    env:
      CI: 'true'
      E2E_STRICT_PLUGINS: '1'
      GITHUB_PAT: $(GITHUB_PAT)
      ACF_DOWNLOAD_URL: $(ACF_DOWNLOAD_URL)

  - script: node tests/e2e/scripts/lambdatest-tunnel.mjs wait
    displayName: Wait for LambdaTest tunnel
    retryCountOnTaskFailure: 2
    env:
      E2E_LAMBDATEST_TUNNEL_NAME: e2e-tunnel-ado-$(Build.BuildId)

  - script: npm run test:e2e:visual
    displayName: Visual e2e tests on LambdaTest
    env:
      CI: 'true'
      E2E_STRICT_PLUGINS: '1'
      LT_USERNAME: $(LT_USERNAME)
      LT_ACCESS_KEY: $(LT_ACCESS_KEY)
      GITHUB_PAT: $(GITHUB_PAT)
      ACF_DOWNLOAD_URL: $(ACF_DOWNLOAD_URL)
      BUILD_ID: $(Build.BuildId)
      E2E_LAMBDATEST_TUNNEL_AUTO: '0'
      E2E_LAMBDATEST_CHROME_VERSION: '154.0'
      E2E_LAMBDATEST_TUNNEL_NAME: e2e-tunnel-ado-$(Build.BuildId)

  - script: npm run tunnel:e2e:stop
    displayName: Stop LambdaTest tunnel
    condition: always()
    env:
      E2E_LAMBDATEST_TUNNEL_NAME: e2e-tunnel-ado-$(Build.BuildId)

  - script: npm run env:e2e:stop
    displayName: Stop wp-env e2e WordPress
    condition: always()

  - script: node tests/e2e/scripts/rank-junit-durations.mjs artifacts/junit/functional-junit.xml artifacts/junit/visual-junit.xml
    displayName: Rank slowest e2e tests
    condition: always()

  - task: PublishTestResults@2
    displayName: Publish JUnit results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: artifacts/junit/*.xml
      mergeTestResults: true

  - task: PublishPipelineArtifact@1
    displayName: Publish failure artifacts
    condition: failed()
    inputs:
      targetPath: artifacts/test-results
      artifact: e2e-artifacts

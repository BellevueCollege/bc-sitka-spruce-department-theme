# ============================================================
# azure-pipelines.yml — CI Pipeline
# - Builds the theme on PRs and tag pushes
# - Deploys to test environments on PRs only
# - Tag builds (v*) produce the artifact consumed by the
#   release pipeline — no manual handoff needed
# - Trunk builds are validation only (no deploy)
# ============================================================

trigger:
  branches:
    include:
      - trunk
  tags:
    include:
      - 'v*'
  paths:
    exclude:
      - azure-pipelines.yml
      - azure-pipelines-release.yml

pr:
  branches:
    include:
      - trunk
      - release-v*
      - hotfix-v*

pool:
  vmImage: ubuntu-latest

variables:
  phpVersion: '8.2'
  npm_config_cache: $(Pipeline.Workspace)/.npm
  COMPOSER_CACHE_DIR: $(Pipeline.Workspace)/.composer
  themeName: 'bc-sitka-spruce-department-theme'

stages:

  # ── Build ────────────────────────────────────────────────
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: BuildTheme
        displayName: 'Build Theme'
        steps:

          - script: |
              sudo update-alternatives --set php /usr/bin/php$(phpVersion)
              sudo update-alternatives --set phar /usr/bin/phar$(phpVersion)
              sudo update-alternatives --set phpdbg /usr/bin/phpdbg$(phpVersion)
              sudo update-alternatives --set php-cgi /usr/bin/php-cgi$(phpVersion)
              sudo update-alternatives --set phar.phar /usr/bin/phar.phar$(phpVersion)
              php -version
            displayName: 'Use PHP $(phpVersion)'

          - task: Cache@2
            inputs:
              key: 'composer | "$(Agent.OS)" | composer.lock'
              restoreKeys: |
                composer | "$(Agent.OS)"
                composer
              path: $(COMPOSER_CACHE_DIR)
            displayName: 'Cache Composer'

          - script: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            displayName: 'Composer Install'

          - task: UseNode@1
            inputs:
              version: '24.x'
            displayName: 'Install Node.js 24'

          - script: npm install -g npm@11.16.0
            displayName: 'Update NPM'

          - task: Cache@2
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(npm_config_cache)
            displayName: 'Cache NPM'

          - task: Npm@1
            inputs:
              command: 'ci'
            displayName: 'NPM Install'

          - task: Npm@1
            inputs:
              command: 'custom'
              customCommand: 'run build'
            displayName: 'NPM Build'

          - task: Npm@1
            inputs:
              command: 'custom'
              customCommand: 'ci --omit=dev'
            displayName: 'NPM Prune Dev Dependencies'

          - task: replacetokens@6
            inputs:
              sources: 'style.css'
              addBOM: true
            displayName: 'Inject Version into style.css'

          # Copy only deploy-worthy files into a correctly named folder
          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                **
                !.git/**
                !.gitignore
                !.gitattributes
                !vrt/**
                !reports/**
                !azure-pipelines*.yml
                !node_modules/.cache/**
              TargetFolder: '$(Build.ArtifactStagingDirectory)/$(themeName)'
            displayName: 'Stage Theme Files'

          # Zip once here — the artifact IS the zip for all deploy stages
          - script: |
              cd $(Build.ArtifactStagingDirectory)
              zip -r $(themeName).zip $(themeName)/
            displayName: 'Package Theme ZIP'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/$(themeName).zip'
              artifact: '$(themeName)'
              publishLocation: 'pipeline'
            displayName: 'Publish Artifact'

  # ── Deploy: Test (PR only, parallel) ────────────────────
  - stage: DeployTest
    displayName: 'Deploy: Test (CStage)'
    dependsOn: Build
    condition: eq(variables['Build.Reason'], 'PullRequest')
    jobs:

      - deployment: KinstaTest
        displayName: 'Kinsta: Test'
        environment: 'test-kinsta'
        variables:
          - group: deploy-kinsta-test
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - download: current
                  artifact: '$(themeName)'
                  displayName: 'Download Artifact'
                # sshServiceConnection must be a literal — must match Project Settings → Service connections
                - template: .azuredevops/templates/deploy-theme.yml
                  parameters:
                    sshServiceConnection: 'Kinsta- BC 2022 Redesign Content Stage - Stage-BC Sitka Spruce Department Theme'
                    zipSourceFolder: '$(Pipeline.Workspace)/$(themeName)'

      # - deployment: KinstaBackstop
      #   displayName: 'Kinsta: BackstopJS'
      #   environment: 'test-backstop'
      #   variables:
      #     - group: deploy-kinsta-backstop
